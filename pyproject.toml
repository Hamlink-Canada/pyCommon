[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "rpt-common"
version = "0.1.0"
description = "Shared Python utilities, database models and migrations"
requires-python = ">=3.13"
readme = "README.md"
license = "AGPL-3.0-or-later"
dependencies = ["SQLAlchemy>=2.1.8,<2.2", "alembic>=1.20.1,<2"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3,<4"]

[project.scripts]
rpt-common-migrate = "rpt_common.migrate:main"

[dependency-groups]
dev = ["pytest>=9.2,<10", "ruff>=0.17.4,<0.18", "build>=1.6,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rpt_common = ["migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
